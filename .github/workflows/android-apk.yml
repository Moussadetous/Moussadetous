name: Construire l’APK Android

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire l’APK installable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer la plateforme Android requise
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le jeu web
        run: npm run build

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Synchroniser les fichiers du jeu
        run: npx cap sync android

      - name: Assembler l’APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l’APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: miette-arbre-des-murmures-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
