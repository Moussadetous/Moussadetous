name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APK files
        run: |
          mkdir -p apk_output
          cp app/build/outputs/apk/debug/app-debug.apk apk_output/MousseOS-debug-${{ github.sha }}.apk
          cp app/build/outputs/apk/release/app-release.apk apk_output/MousseOS-release-${{ github.sha }}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MousseOS-Debug-APK
          path: apk_output/MousseOS-debug-${{ github.sha }}.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MousseOS-Release-APK
          path: apk_output/MousseOS-release-${{ github.sha }}.apk
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apk_output
          pattern: MousseOS-Release-APK
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk_output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apk_output
          pattern: MousseOS-Release-APK
          merge-multiple: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apk_output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
